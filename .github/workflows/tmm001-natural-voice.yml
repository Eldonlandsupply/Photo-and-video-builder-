name: Build TMM001 Natural Voice

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmm001_natural_voice/**'
      - '.github/workflows/tmm001-natural-voice.yml'

permissions:
  contents: read

jobs:
  build-natural-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install speech and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kokoro==0.9.4' 'transformers<5' soundfile numpy

      - name: Generate natural narration alternatives
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python tmm001_natural_voice/synthesize.py \
            --segments tmm001_natural_voice/segments.json \
            --output dist

      - name: Verify narration outputs
        run: |
          set -euxo pipefail
          test -f dist/TMM001_Did_Jesus_Exist_Natural_Warm_Narration_48k.flac
          test -f dist/TMM001_Did_Jesus_Exist_Natural_Male_Narration_48k.flac
          test -f dist/TMM001_Did_Jesus_Exist_Natural_Warm_Voice_Preview_45s.wav
          test -f dist/TMM001_Did_Jesus_Exist_Natural_Male_Voice_Preview_45s.wav
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name,sample_rate,channels -of json dist/TMM001_Did_Jesus_Exist_Natural_Warm_Narration_48k.flac
          find dist -type d -name 'work_*' -prune -exec rm -rf {} +
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload natural narration
        uses: actions/upload-artifact@v4
        with:
          name: TMM001-natural-voice-audio
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
