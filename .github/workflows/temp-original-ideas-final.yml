name: Temporary Original Ideas Only Final Transfer

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/original-ideas-final-url.txt'

permissions:
  contents: read

jobs:
  transfer-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download completed Adobe render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          curl -L --fail --retry 3 "$(cat temporary/original-ideas-final-url.txt)" -o final/Original_Ideas_Only_FINAL.mp4
          test -s final/Original_Ideas_Only_FINAL.mp4
          file final/Original_Ideas_Only_FINAL.mp4
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: original-ideas-only-final-video
          path: final/Original_Ideas_Only_FINAL.mp4
          if-no-files-found: error
          retention-days: 1
