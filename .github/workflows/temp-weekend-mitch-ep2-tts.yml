name: Temporary Weekend at Mitch Episode 2 Voices

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/weekend-mitch-ep2-tts.txt'

permissions:
  contents: read

jobs:
  generate-voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install natural TTS
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate fictional voices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          edge-tts --voice en-US-GuyNeural --rate=+24% --pitch=-1Hz --text "Next up, Mitch." --write-media output/01_announcer_nextup.mp3
          edge-tts --voice en-US-AvaNeural --rate=+18% --text "What will you be performing?" --write-media output/02_judge_question.mp3
          edge-tts --voice en-US-RogerNeural --rate=+20% --text "He's taking a risk." --write-media output/03_judge_risk.mp3
          edge-tts --voice en-US-AvaNeural --rate=+22% --text "He hasn't started." --write-media output/04_judge_notstarted.mp3
          edge-tts --voice en-US-RogerNeural --rate=+35% --text "Exactly." --write-media output/05_judge_exactly.mp3
          edge-tts --voice en-US-JennyNeural --rate=+18% --text "I felt every word." --write-media output/06_audience_everyword.mp3
          edge-tts --voice en-US-AndrewNeural --rate=+20% --text "This is why live television matters." --write-media output/07_judge_livetv.mp3
          edge-tts --voice en-US-GuyNeural --rate=+24% --pitch=-1Hz --text "Mitch goes straight to the finals." --write-media output/08_announcer_finals.mp3
          edge-tts --voice en-US-GuyNeural --rate=+24% --pitch=-1Hz --text "Next up." --write-media output/09_announcer_loop.mp3
      - name: Upload voice bundle
        uses: actions/upload-artifact@v4
        with:
          name: weekend-mitch-ep2-tts
          path: output/*.mp3
          if-no-files-found: error
          retention-days: 1
