name: Temporary Weekend at Mitch Episode 5 Scenes

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/weekend-mitch-ep5-scenes.txt'

permissions:
  contents: read

jobs:
  download-scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Episode 5 scenes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:d2770241-b35f-41f3-b7d6-83a5ed895e93' -o output/01_mitch_haunted.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:f065aae0-bf72-4305-8765-00a0369a6342' -o output/02_security_room.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:efa394d4-40c1-4e13-b245-09982769dedc' -o output/03_monsters_flee.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:5a39338a-0acc-4bd9-bfcd-ff172affc320' -o output/04_hook.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:b23d6f5c-0ead-40d9-8cd2-36ad6c0e484e' -o output/05_end_card.png
          file output/*
          test "$(find output -type f | wc -l)" -eq 5
      - name: Upload scene bundle
        uses: actions/upload-artifact@v4
        with:
          name: weekend-mitch-ep5-scenes
          path: output/*.png
          if-no-files-found: error
          retention-days: 1
