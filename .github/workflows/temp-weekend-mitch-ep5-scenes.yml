name: Temporary Weekend at Mitch Episode 5 Scenes

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/weekend-mitch-ep5-scenes.txt'

permissions:
  contents: read

jobs:
  download-scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Episode 5 scenes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:8391d7f9-a58d-4895-b46a-e26594938334' -o output/01_master.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:fdbf4f53-0689-438e-8eac-27f19387e34b' -o output/02_mitch_tight.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:dacd54b4-8451-4ed2-bdd8-92446b9198b6' -o output/03_vampire.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:e85c44d3-2259-43c2-938f-80b213649f9a' -o output/04_ghoul.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:13b2b3f6-73c4-4cb2-8eb3-9459dc759ef8' -o output/05_security.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:56aaf991-6e5f-43da-ae19-6d488617a530' -o output/06_evacuate.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:346c4ac8-53c0-4782-98cc-69f3e6e35d80' -o output/07_hook.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:d1245acb-9091-4d5e-ae62-aa2ca4d2fe27' -o output/08_payoff.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:e156a678-3b01-41cc-8444-5a815190c55a' -o output/09_engagement.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:fff96ac1-8a24-4e78-b8bf-7e744f4eb85e' -o output/10_disclosure.png
          file output/*
          test "$(find output -type f | wc -l)" -eq 10
      - name: Upload scene bundle
        uses: actions/upload-artifact@v4
        with:
          name: weekend-mitch-ep5-scenes
          path: output/*.png
          if-no-files-found: error
          retention-days: 1
