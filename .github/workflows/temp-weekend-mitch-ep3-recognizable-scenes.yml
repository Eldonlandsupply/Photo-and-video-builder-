name: Temporary Weekend at Mitch Episode 3 Recognizable Scenes

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/weekend-mitch-ep3-recognizable-scenes.txt'

permissions:
  contents: read

jobs:
  download-scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved recognizable Mitch scene crops
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:f8e8f13a-bd6e-41d1-ae2d-1b41cfdc1522' -o output/01_mitch_full.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:a449a9f3-b2dd-40a0-97cf-166510c375d4' -o output/02_mitch_tight.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:b919d22c-c11c-4d28-b792-3fa56018b8b9' -o output/03_left_opponent.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:5ca545e1-1f46-42d5-916f-90ba5a72c5b5' -o output/04_right_opponent.png
          file output/*
          test "$(find output -type f | wc -l)" -eq 4
      - name: Upload scene bundle
        uses: actions/upload-artifact@v4
        with:
          name: weekend-mitch-ep3-recognizable-scenes
          path: output/*.png
          if-no-files-found: error
          retention-days: 1
