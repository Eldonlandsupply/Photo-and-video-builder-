name: Temporary Weekend at Mitch Episode 3 Viral Assets

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/weekend-mitch-ep3-viral-assets.txt'

permissions:
  contents: read

jobs:
  download-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved viral title cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:cefb6e26-2407-4db6-8d4a-d7e696ec1514' -o output/ep3_hook.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:0fdaf97d-043a-4626-80f0-4b9847a5b305' -o output/ep3_reveal.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:166d3b95-1967-47d0-8c1c-3bee2765ee02' -o output/ep3_cta.png
          file output/*
          test "$(find output -type f | wc -l)" -eq 3
      - name: Upload viral cards
        uses: actions/upload-artifact@v4
        with:
          name: weekend-mitch-ep3-viral-assets
          path: output/*.png
          if-no-files-found: error
          retention-days: 1
