name: Temporary Weekend at Mitch Episode 5 Voices

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/weekend-mitch-ep5-tts.txt'

permissions:
  contents: read

jobs:
  generate-voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install natural TTS
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate fictional non-imitative voices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          edge-tts --voice en-US-JennyNeural --rate=+38% --text "Exit's that way." --write-media output/01_employee.mp3
          edge-tts --voice en-US-AndrewNeural --rate=+40% --pitch=-5Hz --text "Nope." --write-media output/02_vampire.mp3
          edge-tts --voice en-US-RogerNeural --rate=+38% --text "I'm out." --write-media output/03_ghoul.mp3
          edge-tts --voice en-US-AvaNeural --rate=+38% --text "He's been there eleven minutes." --write-media output/04_security.mp3
          edge-tts --voice en-GB-RyanNeural --rate=+45% --text "Scared?" --write-media output/05_manager.mp3
          edge-tts --voice en-US-GuyNeural --rate=+45% --text "We are." --write-media output/06_technician.mp3
          edge-tts --voice en-US-GuyNeural --rate=+35% --pitch=-2Hz --text "The haunted house evacuated." --write-media output/07_announcer.mp3
          edge-tts --voice en-US-JennyNeural --rate=+40% --text "Exit's that..." --write-media output/08_loop.mp3
      - name: Upload voice bundle
        uses: actions/upload-artifact@v4
        with:
          name: weekend-mitch-ep5-tts
          path: output/*.mp3
          if-no-files-found: error
          retention-days: 1
