name: Temporary Paxton Self-Investigation Scenes

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/paxton-self-investigation-scenes-trigger.txt'

permissions:
  contents: read

jobs:
  download-scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Firefly scenes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:d107bab4-4921-4f5b-882f-d46a5e7505e2' -o output/01_hook.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:5f44430c-353b-4ac0-b1e9-11a10390df23' -o output/02_master.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:7383f733-a86f-4d7c-a463-dbdefb1789e9' -o output/03_aide.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:0d5b483d-0f9a-4cd6-8a1e-d880eb7ead1a' -o output/04_paxton.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:31d2f9e0-b0eb-40a2-9010-6a1b71eafbf9' -o output/05_detective.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:999a331a-0799-418c-8c83-4b552d3507ed' -o output/06_stamp.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:b29306ed-6bd9-4977-93a5-d58f32cbe243' -o output/07_end.png
          file output/*
          test "$(find output -type f | wc -l)" -eq 7
      - name: Upload scene bundle
        uses: actions/upload-artifact@v4
        with:
          name: paxton-self-investigation-scenes
          path: output/*.png
          if-no-files-found: error
          retention-days: 1
