name: Weekend at Mitch Production

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/tts-trigger.txt'
      - 'temporary/video-url.txt'

permissions:
  contents: read

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install natural TTS
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate fictional voices
        shell: bash
        run: |
          mkdir -p output
          edge-tts --voice en-US-GuyNeural --rate=+20% --pitch=-2Hz --text "Ladies and gentlemen, your host, Mitch McConnell." --write-media output/01_announcer_intro.mp3
          edge-tts --voice en-US-JennyNeural --rate=+20% --text "Is this the monologue?" --write-media output/02_producer_question.mp3
          edge-tts --voice en-US-RogerNeural --rate=+20% --text "I think he's doing crowd work." --write-media output/03_producer_crowdwork.mp3
          edge-tts --voice en-US-JennyNeural --rate=+20% --text "He hasn't said anything." --write-media output/04_producer_nothing.mp3
          edge-tts --voice en-US-RogerNeural --rate=+35% --text "Exactly." --write-media output/05_producer_exactly.mp3
          edge-tts --voice en-US-AriaNeural --rate=+20% --text "This is the bravest thing I've ever seen." --write-media output/06_audience_bravest.mp3
          edge-tts --voice en-GB-RyanNeural --rate=+20% --text "Do we cut to commercial?" --write-media output/07_cast_commercial.mp3
          edge-tts --voice en-US-RogerNeural --rate=+25% --text "We never left." --write-media output/08_producer_never_left.mp3
          edge-tts --voice en-US-GuyNeural --rate=+20% --pitch=-2Hz --text "Next week, musical guest." --write-media output/09_announcer_nextweek.mp3
          edge-tts --voice en-US-GuyNeural --rate=+20% --pitch=-2Hz --text "Ladies and gentlemen." --write-media output/10_announcer_loop.mp3
      - name: Upload voices
        uses: actions/upload-artifact@v4
        with:
          name: weekend-at-mitch-tts
          path: output/*.mp3
          if-no-files-found: error
          retention-days: 1
      - name: Download final Adobe render
        if: ${{ hashFiles('temporary/video-url.txt') != '' }}
        shell: bash
        run: |
          curl -L --fail --retry 3 "$(cat temporary/video-url.txt)" -o output/Weekend_at_Mitchs_Ep1_REALISTIC_FINAL.mp4
          test -s output/Weekend_at_Mitchs_Ep1_REALISTIC_FINAL.mp4
      - name: Upload final video
        if: ${{ hashFiles('temporary/video-url.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekend-at-mitch-final-video
          path: output/Weekend_at_Mitchs_Ep1_REALISTIC_FINAL.mp4
          if-no-files-found: error
          retention-days: 1
