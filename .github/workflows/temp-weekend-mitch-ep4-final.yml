name: Temporary Weekend at Mitch Episode 4 Final Transfer

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/weekend-mitch-ep4-final-url.txt'

permissions:
  contents: read

jobs:
  transfer-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download completed Adobe render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          curl -L --fail --retry 3 "$(cat temporary/weekend-mitch-ep4-final-url.txt)" -o final/Weekend_at_Mitchs_Ep4_FIRST_CONTACT_FINAL.mp4
          test -s final/Weekend_at_Mitchs_Ep4_FIRST_CONTACT_FINAL.mp4
          file final/Weekend_at_Mitchs_Ep4_FIRST_CONTACT_FINAL.mp4
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: weekend-mitch-ep4-final-video
          path: final/Weekend_at_Mitchs_Ep4_FIRST_CONTACT_FINAL.mp4
          if-no-files-found: error
          retention-days: 1
