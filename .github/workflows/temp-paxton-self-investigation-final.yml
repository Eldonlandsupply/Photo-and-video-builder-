name: Temporary Paxton Self-Investigation Final Transfer

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/paxton-self-investigation-final-url.txt'

permissions:
  contents: read

jobs:
  transfer-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download completed Adobe render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          curl -L --fail --retry 3 "$(cat temporary/paxton-self-investigation-final-url.txt)" -o final/Ken_Paxton_Self_Investigation_FINAL.mp4
          test -s final/Ken_Paxton_Self_Investigation_FINAL.mp4
          file final/Ken_Paxton_Self_Investigation_FINAL.mp4
      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: paxton-self-investigation-final-video
          path: final/Ken_Paxton_Self_Investigation_FINAL.mp4
          if-no-files-found: error
          retention-days: 1
