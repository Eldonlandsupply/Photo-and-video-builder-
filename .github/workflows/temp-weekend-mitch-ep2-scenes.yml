name: Temporary Weekend at Mitch Episode 2 Scene Download

on:
  pull_request:
    branches: [main]
    paths:
      - 'temporary/weekend-mitch-ep2-scenes.txt'

permissions:
  contents: read

jobs:
  download-scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved photorealistic scene assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:b714d6c6-10bc-4310-a505-7864df594ffe' -o output/01_stage.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:4924b72e-31c1-4507-bb94-7ee39bcaf3f8' -o output/02_judges.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:57d7d159-88e1-49dd-af95-d5c18f53ae02' -o output/03_audience.png
          curl -L --fail --retry 3 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:4adbb558-f5b0-4c1a-8725-440f9b840577' -o output/04_buttons.png
          file output/*
          test "$(find output -type f | wc -l)" -eq 4
      - name: Upload scene bundle
        uses: actions/upload-artifact@v4
        with:
          name: weekend-mitch-ep2-scenes
          path: output/*.png
          if-no-files-found: error
          retention-days: 1
